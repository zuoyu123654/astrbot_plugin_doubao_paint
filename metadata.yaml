name: astrbot_plugin_doubao_paint
logo: ./logo.png
display_name: 豆包画画
short_desc: 在 QQ 里说「画一张…」就出图并直接发回来；图生图、她自己的形象、按当前状态画；生图后端可选本地豆包或任意 OpenAI 兼容 API
desc: >-
  【前置（二选一）】
  **① 本地豆包**：本机装了「豆包」桌面客户端并**已登录**；装了 DSH 插件
  `dsh-doubao-painter`（https://github.com/zuoyu123654/dsh-doubao-painter，或用本机
  `~/.dsh/plugins/dsh-doubao-painter`）负责 CDP 驱动豆包；本机有 `node`（>= 22）。
  **② 生图 API**：任意 OpenAI 兼容的 `/images/generations`（OpenAI / 硅基流动 / 中转站），填 base + key 即可。

  【功能】
  1. **一句话出图**：QQ 里说「画一张……」，她调 `doubao_paint`，图直接发回当前会话。
  2. **图生图，三种时序都支持**：
     - 图和需求一起发 → 用这条消息里的图；
     - 先发图、后说需求 → 记住最近 30 分钟发过的图；
     - 先说需求、后发图 → 需求挂起（默认 5 分钟），收到图自动接着画并回发。
  3. **她自己的形象**：`refs/` 里按**文件名**挑参考图（括号里的字也算，例如「默认（Q版可爱 女仆装）」
     「成熟（长大）」），不限张数；挑不到用名字带「默认」的那张。
     一张都没有也能画：退化成文字描述（默认「蓝色大肥鱼」那套，可用 `self_appearance` 改成自己的角色）。
  4. **按状态画**：只在「画你自己 / 你现在的状态」时启用——把当前时间（白天/夜晚）、
     真实天气（只取天气/温度/湿度，**不含地区**）、情绪/精力/身体放到提示词最前面，
     并要求画面光线和天气对得上。
  5. **两种后端**：`image_backend=doubao`（本机豆包）或 `openai`（任意兼容接口，纯文字走
     `/images/generations`，带参考图走 `/images/edits`）。
  6. **她想画就画**：聊天里聊到好吃的/好看的，她可以主动画一张发过来（默认 30 分钟冷却）。
  7. **默认只有主人能用**（access_mode=owner，认 cmd_config.json 的 admins_id）。
  8. 自检工具 `doubao_paint_status` / `doubao_list_refs` / `doubao_now_playing`；
     生成图 7 天自动清理；并发锁（一次只画一张）。

  【关于水印】本地豆包取的是 CDN 上的 cgen 原图（1536/1920 高清），但**免费套餐账号的原图仍带
  「豆包 AI生成」水印**，要完全干净得用会员账号；生图 API 一般无水印（看服务商）。

  【怎么用】
  装好前置后，把这句话发给你的 AI：

  「请帮我配置好 AstrBot 里的【豆包画画】插件，并验证是否可用。」

  AI 会先问你要「本地豆包」还是「生图模型 API」，再按 SETUP-FOR-AI.md 配好、放参考图、真画一张验证。

